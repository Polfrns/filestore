services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-leedeo_filestore}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DB_NAME: ${DB_NAME:-leedeo_filestore}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      OBSERVABILITY_CONTENT_MODE: ${OBSERVABILITY_CONTENT_MODE:-redacted}
      OBSERVABILITY_CONTENT_MAX_CHARS: ${OBSERVABILITY_CONTENT_MAX_CHARS:-4000}
      OBSERVABILITY_TRACE_SECRET: ${OBSERVABILITY_TRACE_SECRET:-}
      LANGFUSE_TRACING_ENABLED: ${LANGFUSE_TRACING_ENABLED:-true}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      DB_PORT: 5432
      CHROMA_DB_PATH: /data/chroma
      FILESTORE_ROOT: /data/filestores
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - ./chroma_db:/data/chroma
      - ./filestores_data:/data/filestores
      - ./uploads:/app/uploads
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
